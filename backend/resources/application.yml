spring:
  application:
    name: links-service

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true

  liquibase:
    change-log: classpath:changelog/db.changelog-master.xml
    enabled: true
    drop-first: false

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level: %msg%n"

server:
  address: 0.0.0.0
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha