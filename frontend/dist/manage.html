<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="header">
    <div class="container header-inner">
        <a href="index.html" class="logo">🔗 Links</a>
        <nav class="nav">
            <a href="index.html" class="nav-link">Просмотр ссылок</a>
            <a href="manage.html" class="nav-link active">Добавить / удалить</a>
            <a href="contacts.html" class="nav-link">Контакты</a>
        </nav>
    </div>
</header>

<main class="container">
    <h1>Управление ссылками</h1>

    <section class="form-card">
        <h2 id="form-title">Новая ссылка</h2>
        <form id="link-form" novalidate>
            <input type="hidden" id="link-id">
            <div class="field">
                <label for="title">Название *</label>
                <input class="input" id="title" required maxlength="100" placeholder="Например: Документация Kotlin">
            </div>
            <div class="field">
                <label for="url">URL *</label>
                <input class="input" id="url" required placeholder="https://kotlinlang.org">
            </div>
            <div class="field">
                <label for="description">Описание</label>
                <textarea class="textarea" id="description" rows="2" maxlength="300" placeholder="Необязательное описание"></textarea>
            </div>
            <div class="form-actions">
                <button type="submit" id="submit-btn" class="btn btn-primary">Добавить ссылку</button>
                <button type="button" id="cancel-btn" class="btn btn-secondary hidden">Отмена</button>
            </div>
        </form>
    </section>

    <p id="manage-counter" class="muted small"></p>
    <div id="manage-list" class="cards"></div>
    <div id="manage-empty" class="empty">
        <p>Хранилище пусто. Добавьте первую ссылку через форму выше.</p>
    </div>
</main>

<footer class="footer container muted small">
    Links - сервис хранения ссылок. Хранилище в памяти, до 50 записей.
</footer>

<div id="toast" class="toast" role="status"></div>
<script src="js/common.js"></script>
<script src="js/manage.js"></script>
</body>

</html>
