<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links — вход</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="header">
    <div class="container header-inner">
        <a href="index.html" class="logo">🔗 Links</a>
        <nav class="nav">
            <a href="index.html" class="nav-link">Просмотр ссылок</a>
            <a href="manage.html" class="nav-link">Добавить / удалить</a>
            <a href="contacts.html" class="nav-link">Контакты</a>
            <a href="login.html" class="nav-link active" id="auth-link">Войти</a>
        </nav>
    </div>
</header>

<main class="container">
    <h1 id="auth-title">Вход в аккаунт</h1>

    <section class="form-card">
        <form id="auth-form" novalidate>
            <div class="field">
                <label for="username">Логин *</label>
                <input class="input" id="username" required maxlength="50" autocomplete="username" placeholder="Например: user">
            </div>
            <div class="field">
                <label for="password">Пароль *</label>
                <input class="input" id="password" type="password" required maxlength="100" autocomplete="current-password" placeholder="••••••••">
            </div>
            <div class="form-actions">
                <button type="submit" id="submit-btn" class="btn btn-primary">Войти</button>
                <button type="button" id="switch-btn" class="btn btn-secondary">Регистрация</button>
            </div>
        </form>
    </section>
</main>

<footer class="footer container muted small">
    Links - сервис хранения ссылок.
</footer>

<div id="toast" class="toast" role="status"></div>
<script src="js/common.js"></script>
<script src="js/login.js"></script>
</body>

</html>
